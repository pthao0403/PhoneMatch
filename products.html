<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Điện thoại | PhoneMatch</title>
  <meta name="description" content="Danh sách điện thoại để lọc và so sánh theo hãng, ngân sách và nhu cầu.">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header class="header">
    <div class="container nav">
      <a class="logo" href="index.html">Phone<span>Match</span></a>

      <button
        class="menu-btn"
        id="menuBtn"
        type="button"
        aria-label="Mở menu"
        aria-expanded="false"
      >
        ☰
      </button>

      <nav id="mainNav" aria-label="Điều hướng chính">
        <a href="index.html">Trang chủ</a>
        <a class="active" href="products.html" aria-current="page">Điện thoại</a>
        <a href="compare.html">So sánh</a>
        <a href="finder.html">Tư vấn</a>
        <a href="guides.html">Góc tư vấn</a>
        <a href="faq.html">FAQ</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow">Product catalog</span>
        <h1>Khám phá điện thoại</h1>
        <p>Lọc theo ngân sách, hãng và nhu cầu sử dụng.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="filters">
          <label>
            <span class="sr-only">Tìm kiếm điện thoại</span>
            <input
              id="searchInput"
              type="search"
              placeholder="Tìm tên điện thoại..."
              autocomplete="off"
            >
          </label>

          <label>
            <span class="sr-only">Lọc theo hãng</span>
            <select id="brandFilter">
              <option value="">Tất cả hãng</option>
            </select>
          </label>

          <label>
            <span class="sr-only">Lọc theo giá</span>
            <select id="priceFilter">
              <option value="">Tất cả mức giá</option>
              <option value="5">Dưới 5 triệu</option>
              <option value="10">5–10 triệu</option>
              <option value="15">10–15 triệu</option>
              <option value="999">Trên 15 triệu</option>
            </select>
          </label>

          <label>
            <span class="sr-only">Sắp xếp sản phẩm</span>
            <select id="sortSelect">
              <option value="">Sắp xếp mặc định</option>
              <option value="price-asc">Giá thấp đến cao</option>
              <option value="price-desc">Giá cao đến thấp</option>
              <option value="name-asc">Tên A–Z</option>
            </select>
          </label>
        </div>

        <div id="productGrid" class="product-grid" aria-live="polite">
          <p>Đang tải danh sách điện thoại...</p>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container footer-grid">
      <div>
        <div class="logo">Phone<span>Match</span></div>
        <p>Website tư vấn và so sánh điện thoại.</p>
      </div>
    </div>
  </footer>

  <script src="js/data.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
